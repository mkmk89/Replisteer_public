name: Problem
description: Something does not work as described.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting! Please remove connection strings, passwords and personal data from everything you paste.
  - type: dropdown
    id: part
    attributes:
      label: Where does it happen?
      options:
        - XrmToolBox tool
        - Command line runner
        - Documentation
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: "`replisteer version`, or the version of the tool in XrmToolBox (and the XrmToolBox version)."
      placeholder: 1.2026.10.1
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to reproduce it
      description: The source and target types, the step operations and formulas involved, and what you clicked or ran.
  - type: textarea
    id: messages
    attributes:
      label: Messages
      description: Error messages, the log (Run tab > Export > Log) or the command line output.
      render: text
