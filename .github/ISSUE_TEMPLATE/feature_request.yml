name: Idea
description: Suggest a feature or an improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: The task or data flow, and what makes it hard today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could Replisteer help?
