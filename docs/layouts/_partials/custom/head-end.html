{{- /*
  Replisteer Cloud: its menu link stays hidden unless the service's status answers that it is offered, as the Cloud Run
  tab of the XrmToolBox tool. The link's address comes from this site, never from the answer.
*/ -}}
{{- with site.Params.cloud }}
<style>html:not(.replisteer-cloud) a[href^="{{ .url }}"]{display:none!important}</style>
<script>
  (function () {
    try {
      var nonce = Array.from(crypto.getRandomValues(new Uint8Array(16)), function (b) { return b.toString(16).padStart(2, "0"); }).join("");
      fetch({{ .status }} + "?nonce=" + nonce, { credentials: "omit" })
        .then(function (response) { return response.ok ? response.json() : null; })
        .then(function (answer) {
          var status = answer && JSON.parse(answer.payload);
          if (status && status.available === true && status.nonce === nonce) document.documentElement.classList.add("replisteer-cloud");
        })
        .catch(function () {});
    } catch (e) {}
  })();
</script>
{{- end }}
